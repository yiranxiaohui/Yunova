[workspace]
members = [".", "worker"]

[package]
name = "yunova"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "mysql", "postgres", "chrono", "macros"] }
toml = "0.8"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
time = "0.3"
base64 = "0.22"
md-5 = "0.10"
urlencoding = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "hostname"] }
