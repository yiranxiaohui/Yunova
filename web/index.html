<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for crisp tab icons at any DPI; the .ico carries the 16/32px
         rasters for older browsers and Windows pinned sites, and the PNG is the
         last resort. Apple ignores SVG here and needs its own opaque 180px PNG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` is required for env(safe-area-inset-*) to report
         real values; without it iOS letterboxes the page and the bottom
         composer sits under the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Yunova — 统一的 Agent 工作空间，整合多模型对话、工具执行、创作与工作流，支持自托管。"
    />
    <meta name="theme-color" content="#6d3bd1" />
    <title>Yunova · Agent 工作空间</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
