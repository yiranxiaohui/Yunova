[package]
name = "yunova-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yunova-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time", "net", "signal", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls 0.23 需要显式选定加密后端；用 ring（musl 友好），并在 main 开头
# install_default()，否则连 wss:// 时会 panic（无法自动确定 CryptoProvider）。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
