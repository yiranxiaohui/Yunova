name: Release desktop client

# 桌面客户端（yunova-desktop）是分发到用户自己电脑上的桌面应用：内置站点界面，
# 并把这台电脑变成 Agent 的执行目标。它不进服务端镜像。打 vX.Y.Z tag 时构建各
# 平台安装包，作为 GitHub Release 附件；网页的 /download 页面直接读这个
# Release 的资产列表。
#
# 安装包同时是**更新包**：客户端内置 updater 会读本 Release 的 latest.json，
# 并用编译进二进制的公钥验签。因此 TAURI_SIGNING_PRIVATE_KEY 必须配置且与
# desktop/tauri.conf.json 里的 pubkey 成对——缺了它构建仍然成功，但产不出
# .sig，装出去的客户端会永远更新失败（见 desktop/tests/updater_config.rs）。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write # 需要写权限才能上传到 Release

jobs:
  # 先确保该 tag 的 GitHub Release 存在——tauri-action 会上传到已存在的 Release，
  # 由这一步统一创建，避免各平台并发时重复创建。
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create release if missing
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Ubuntu 22.04 for the widest glibc/webkit compatibility: a .deb or
          # AppImage linked against a newer webkit2gtk will not install on the
          # LTS releases most users are on.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The window shell links against the system webview. On Linux that has
      # to be installed; macOS and Windows ship theirs (WebKit / WebView2).
      - name: Install Linux webview dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libsoup-3.0-dev libxdo-dev \
            xdg-utils

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # Builds the installers (.dmg/.app, .msi/.exe, .deb/.AppImage) and the
      # bare binary, then uploads them to the tag's Release. `projectPath`
      # points at the client crate: the workspace root's build.rs compiles the
      # web bundle, which this app does not need — it loads the site over the
      # network — and which would require bun on every runner.
      #
      # `uploadUpdaterJson: false` is load-bearing. The action builds
      # `latest.json` by *reading the asset back, merging its own platform key
      # and re-uploading it*, and all five matrix jobs finish at overlapping
      # times: two jobs that read the same version lose one of the two
      # platforms, and the loss is invisible until a user on that platform
      # never sees an update. The manifest is therefore assembled once, after
      # the matrix, by the `updater-manifest` job below.
      - name: Build & upload desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without it the bundler produces no
          # `.sig` and the release cannot be used for updates at all.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
          # The action's own manifest upload is a read-modify-write on one
          # shared asset, and the five platform jobs overlap: on v0.4.23 two
          # of them raced and left `latest.json` registered but pointing at a
          # deleted blob (`BlobNotFound`), which every client would have
          # fetched as a 404. The `updater-manifest` job below writes it once
          # instead. NOTE: the input is `includeUpdaterJson` -- `v0` rejects
          # any other spelling with a *warning* and carries on doing the
          # racing upload, which is exactly how v0.4.23 shipped broken.
          includeUpdaterJson: false
          # GitHub's asset uploads fail intermittently on the large bundles
          # here -- v0.4.24 lost three of five platforms to "other side
          # closed" and "Error creating asset temp dir", on builds that had
          # compiled and signed perfectly. With no retries a transient network
          # error is indistinguishable from a real failure, and the whole
          # release has to be re-cut.
          retryAttempts: 3

      # Fails the job rather than shipping an un-updatable release: a missing
      # or wrong signing secret is silent in the build above, and the symptom
      # lands months later on a user's machine as "检查更新" that never
      # succeeds.
      - name: Verify the updater artifacts were signed
        shell: bash
        run: |
          # `find`, not a `**` glob: the macOS runners still ship bash 3.2,
          # where `globstar` does not exist, so the glob stayed literal and
          # the check failed on a build that had in fact signed correctly.
          count=$(find "target/${{ matrix.target }}/release/bundle" -name '*.sig' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no .sig files were produced for ${{ matrix.target }}." \
                 "TAURI_SIGNING_PRIVATE_KEY is probably missing or wrong, and" \
                 "clients would never be able to verify an update." >&2
            exit 1
          fi
          find "target/${{ matrix.target }}/release/bundle" -name '*.sig' -print

      # The bare executable stays published alongside the installers: it is
      # what a headless server runs (`yunova-desktop --headless`), where an
      # installer and a desktop entry are useless. Names must match
      # `web/src/lib/downloads.ts`, which `web/tests/downloads.test.ts` guards.
      - name: Package the standalone binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/yunova-desktop
          name=yunova-desktop-${{ matrix.target }}
          if [ -f "$bin.exe" ]; then
            7z a "$name.zip" "./$bin.exe"
          else
            tar -czf "$name.tar.gz" -C "$(dirname "$bin")" yunova-desktop
          fi

      - name: Upload the standalone binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload whichever archive the step above produced: `.zip` on
          # Windows, `.tar.gz` elsewhere. It has to be a real glob, because
          # `nullglob` only discards *patterns* that match nothing -- the
          # previous version named both extensions literally, so every platform
          # ran `gh release upload` once on a file that could not exist, and
          # that failure alone failed the job after the right archive had
          # already been uploaded.
          shopt -s nullglob
          found=(yunova-desktop-${{ matrix.target }}.*)
          if [ ${#found[@]} -eq 0 ]; then
            echo "no standalone archive was produced for ${{ matrix.target }}" >&2
            exit 1
          fi
          for f in "${found[@]}"; do
            # Same transient upload failures as the bundles above, and this is a
            # plain `gh` call with no retry of its own.
            for attempt in 1 2 3; do
              if gh release upload "${GITHUB_REF_NAME}" "$f" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::failed to upload $f after 3 attempts" >&2
                exit 1
              fi
              echo "upload of $f failed, retrying ($attempt/3)..." >&2
              sleep $((attempt * 10))
            done
          done

  # Assemble `latest.json` once, from the assets the matrix actually published.
  #
  # Written here rather than by each build job because the file is one shared
  # mutable object: five concurrent read-modify-write cycles drop platform
  # entries at random. Doing it after the matrix also means the manifest is
  # only ever published for a release whose builds all succeeded, so a client
  # cannot be pointed at an update that half-exists.
  #
  # The `.sig` contents must be inlined -- the updater rejects a path or a URL
  # -- and the asset URLs are the tag's own `download/<tag>/<asset>` form so
  # the manifest keeps resolving after `latest` has moved on.
  updater-manifest:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gh release download "$TAG" --dir "$work" --pattern '*.sig'

          # A `latest.json` already on the release means the build jobs uploaded
          # one themselves -- i.e. the input that disables that upload was
          # renamed again and silently ignored. Left alone, the racing uploads
          # are what corrupted v0.4.23, so fail loudly instead of writing this
          # job's copy over whatever state that race happened to leave behind.
          if gh release view "$TAG" --json assets \
               --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "::error::the build jobs uploaded latest.json themselves, so" \
                 "tauri-action's manifest upload is still enabled. Check the" \
                 "'includeUpdaterJson: false' input still matches the action's" \
                 "current input name." >&2
            exit 1
          fi

          # Map an asset name to the `OS-ARCH` key the updater looks up. The
          # installer extension decides the OS, and the architecture is read
          # from the bundler's own spelling in the file name.
          python3 - "$work" "$TAG" "$REPO" <<'PY' > "$work/latest.json"
          import json, os, re, sys, urllib.parse

          work, tag, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          version = tag.lstrip("v")
          base = f"https://github.com/{repo}/releases/download/{urllib.parse.quote(tag)}"

          def arch_of(name: str) -> str | None:
              low = name.lower()
              if re.search(r"aarch64|arm64", low):
                  return "aarch64"
              if re.search(r"x86_64|amd64|x64", low):
                  return "x86_64"
              return None

          # Only updater-capable bundles belong here. A `.deb` is owned by
          # dpkg and the bare `.tar.gz` has no installer, so both are download
          # artifacts only -- the client refuses to self-update in those
          # shapes and says so.
          def os_of(name: str) -> str | None:
              if name.endswith(".AppImage.sig"):
                  return "linux"
              if name.endswith(".app.tar.gz.sig"):
                  return "darwin"
              if name.endswith("-setup.exe.sig") or name.endswith(".msi.sig"):
                  return "windows"
              return None

          platforms: dict[str, dict[str, str]] = {}
          for sig in sorted(os.listdir(work)):
              if not sig.endswith(".sig"):
                  continue
              target_os, arch = os_of(sig), arch_of(sig)
              if not target_os or not arch:
                  print(f"skipping {sig}", file=sys.stderr)
                  continue
              with open(os.path.join(work, sig), encoding="utf-8") as f:
                  signature = f.read().strip()
              asset = sig[: -len(".sig")]
              platforms[f"{target_os}-{arch}"] = {
                  "signature": signature,
                  "url": f"{base}/{urllib.parse.quote(asset)}",
              }

          if not platforms:
              raise SystemExit("no updater signatures found; refusing to publish an empty manifest")

          json.dump(
              {"version": version, "notes": f"Yunova {tag}", "pub_date": None, "platforms": platforms},
              sys.stdout,
              indent=2,
              ensure_ascii=False,
          )
          PY

          # `pub_date` must be RFC 3339 or absent; emit it here where `date`
          # can produce the right format.
          python3 - "$work/latest.json" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" <<'PY'
          import json, sys
          path, now = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["pub_date"] = now
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          PY

          echo "platforms in the manifest:"
          python3 -c 'import json,sys; print("\n".join(sorted(json.load(open(sys.argv[1]))["platforms"])))' "$work/latest.json"

          # Every platform the matrix builds must be in the manifest. A
          # partial manifest is the quiet failure this whole job exists to
          # prevent: it publishes cleanly and only the users of the missing
          # platform ever notice, months later, by never being offered an
          # update.
          python3 - "$work/latest.json" <<'PY'
          import json, sys
          expected = {
              "linux-x86_64",
              "linux-aarch64",
              "darwin-x86_64",
              "darwin-aarch64",
              "windows-x86_64",
          }
          got = set(json.load(open(sys.argv[1]))["platforms"])
          missing = sorted(expected - got)
          if missing:
              print(f"::error::latest.json is missing {missing}; refusing to "
                    "publish a manifest that silently excludes a platform")
              raise SystemExit(1)
          PY

          gh release upload "$TAG" "$work/latest.json" --clobber
